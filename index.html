<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="Aidin Shekari - Personal Portfolio and Links" />
  <meta name="keywords" content="Github, Aidin Shekari, Portfolio, Blog, Developer" />
  <meta name="author" content="Aidin Shekari" />
  <meta name="theme-color" content="#000000" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Aidin Shekari | About</title>

  <link rel="shortcut icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"/>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto+Mono:wght@400;600&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: #000000;
      color: #D7F5FF;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 2rem;
      cursor: none;
      overflow-x: hidden;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* --- Electronics / Control Systems Background --- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(820px 520px at 18% 12%, rgba(255, 255, 255, 0.03), transparent 62%),
        radial-gradient(720px 520px at 82% 18%, rgba(255, 255, 255, 0.025), transparent 62%),
        radial-gradient(900px 700px at 50% 92%, rgba(255, 255, 255, 0.02), transparent 68%),
        linear-gradient(180deg, #000000, #0a0a0a 55%, #000000);
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        /* scope grid */
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 26px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 26px),
        /* thick grid */
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.10) 0 1px, transparent 1px 130px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.10) 0 1px, transparent 1px 130px);
      opacity: 0.4;
      mix-blend-mode: screen;
      filter: blur(0px);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: -40% 0;
      background:
        linear-gradient(180deg,
          transparent 0%,
          rgba(255, 255, 255, 0.04) 35%,
          rgba(255, 255, 255, 0.08) 50%,
          rgba(255, 255, 255, 0.04) 65%,
          transparent 100%);
      transform: translateY(-60%);
      animation: scanline 7.5s linear infinite;
      opacity: 0.5;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    @keyframes scanline {
      0% { transform: translateY(-60%); }
      100% { transform: translateY(60%); }
    }

    .bg-nodes { position: absolute; inset: 0; }

    .bg-wires {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.9;
      mix-blend-mode: screen;
      pointer-events: none;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.05));
    }

    .wire {
      fill: none;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .wire.base {
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1.5;
      opacity: 0.9;
    }

    .wire.trace {
      stroke: rgba(255, 255, 255, 0.18);
      stroke-width: 2;
      opacity: 1;
    }

    .wire.signal {
      stroke: rgba(255, 255, 255, 0.45);
      stroke-width: 2.5;
      stroke-dasharray: 4 18;
      animation: signalFlow 2.8s linear infinite;
      opacity: 0.9;
    }

    .wire.signal.slow { animation-duration: 4.5s; opacity: 0.5; }
    .wire.signal.fast { animation-duration: 1.6s; opacity: 1; }

    @keyframes signalFlow {
      to { stroke-dashoffset: -180; }
    }

    .wire-dot {
      fill: rgba(255, 255, 255, 0.5);
      opacity: 0.85;
    }

    .motor circle.wire.base {
      fill: rgba(0, 0, 0, 0.5);
      stroke-width: 2;
    }

    .motor circle.wire.trace {
      fill: rgba(255, 255, 255, 0.05);
      stroke-width: 1.5;
    }

    .motor line {
      stroke-width: 2;
    }
    .node {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.15);
      opacity: 0.5;
      animation: nodePulse 3.2s ease-in-out infinite;
    }

    .node::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @keyframes nodePulse {
      0%, 100% { transform: scale(0.9); opacity: 0.35; }
      50% { transform: scale(1.25); opacity: 0.75; }
    }

    /* --- Instrument Panel Card --- */
    .profile-card {
      max-width: 760px;
      width: 100%;
      z-index: 10;
      animation: fadeInCard 0.9s ease-out forwards;
      opacity: 0;
    }

    @keyframes fadeInCard {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .profile-box {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2.4rem 2rem 2rem;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 12px 50px rgba(0, 0, 0, 0.65),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      overflow: hidden;
    }

    .profile-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.06), transparent 42%),
        linear-gradient(300deg, rgba(255, 255, 255, 0.04), transparent 44%);
      opacity: 0.8;
      pointer-events: none;
    }

    .profile-box::after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      opacity: 0.6;
      pointer-events: none;
    }

    .profile-box:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow:
        0 16px 65px rgba(0, 0, 0, 0.7),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .status-strip {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.6rem;
      font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.82rem;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: rgba(215, 245, 255, 0.86);
      position: relative;
      z-index: 1;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      white-space: nowrap;
    }

    .led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
      animation: ledBlink 1.6s ease-in-out infinite;
    }

    @keyframes ledBlink {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .meters {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: flex-end;
      flex: 1;
    }

    .meter {
      width: 14px;
      height: 8px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      position: relative;
      overflow: hidden;
    }

    .meter::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.0), rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.0));
      transform: translateX(-120%);
      animation: meterSweep 2.2s ease-in-out infinite;
      opacity: 0.8;
    }

    @keyframes meterSweep {
      0% { transform: translateX(-120%); }
      50% { transform: translateX(120%); }
      100% { transform: translateX(120%); }
    }

    /* Avatar */
    .profile-avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin-bottom: 1.5rem;
      transition: transform 0.3s ease, border-color 0.3s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      z-index: 1;
    }

    .profile-avatar:hover {
      transform: scale(1.08);
      border-color: #fff;
    }

    /* Bio */
    .profile-name {
      font-size: 2.2rem;
      font-weight: 600;
      color: rgba(235, 255, 252, 0.98);
      margin-bottom: 0.3rem;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }

    .profile-role {
      font-size: 1rem;
      color: rgba(215, 245, 255, 0.85);
      margin-bottom: 0.6rem;
      position: relative;
      z-index: 1;
    }

    .profile-tagline {
      font-size: 0.95rem;
      font-style: italic;
      color: rgba(215, 245, 255, 0.68);
      margin-bottom: 1.5rem;
      position: relative;
      z-index: 1;
    }



    /* --- Social Bar (below bio) --- */
    .social-bar {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .social-bar a {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background:
        radial-gradient(18px 18px at 35% 35%, rgba(255, 255, 255, 0.12), transparent 55%),
        rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.85);
      font-size: 1.45rem;
      transition: all 0.25s ease;
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 10px 24px rgba(0,0,0,0.6),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      text-decoration: none;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.1);
    }

    .social-bar a:hover {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.98);
      transform: scale(1.15);
      box-shadow: 0 10px 26px rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .social-bar a:focus {
      outline: none;
    }

    .social-bar a:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 4px;
    }

    /* --- Custom Cursor --- */
    [class^="cursor"] {
      position: fixed;
      top: 0;
      left: 0;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 9999;
      pointer-events: none;
      transition: width 0.2s, height 0.2s, border-color 0.2s;
    }

    .cursor-outer {
      width: 30px;
      height: 30px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .cursor-inner {
      width: 6px;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.2);
    }

    a:hover ~ .cursor-outer,
    .profile-avatar:hover ~ .cursor-outer,
    .profile-box:hover ~ .cursor-outer {
      width: 52px;
      height: 52px;
      border-color: rgba(255, 255, 255, 0.5);
    }

    /* --- Reduced motion / accessibility --- */
    @media (prefers-reduced-motion: reduce) {
      .bg::after,
      .profile-card,
      .meter::after,
      .node,
      .led,
      .wire.signal {
        animation: none !important;
      }
      body { cursor: default; }
      .cursor-outer, .cursor-inner { display: none; }
    }

    /* --- Responsive --- */
    @media (max-width: 480px) {
      body { padding: 1rem; cursor: default; }
      .profile-avatar { width: 120px; height: 120px; }
      .cursor-outer, .cursor-inner { display: none; }
    }
  </style>
</head>
<body>

      <g class="motor" transform="translate(820,420)">

    </svg>
    <div class="bg-nodes" id="bgNodes"></div>
  </div>

  <!-- Custom Cursor -->
  <div class="cursor-outer"></div>
  <div class="cursor-inner"></div>
  <script>
    // Lightweight "electronics lab" background nodes
    (function initNodes() {
      const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const container = document.getElementById('bgNodes');
      if (!container || prefersReduced) return;

      const count = Math.min(42, Math.max(24, Math.floor(window.innerWidth / 38)));
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'node';
        el.style.left = Math.random() * 100 + '%';
        el.style.top = Math.random() * 100 + '%';
        el.style.animationDelay = (Math.random() * 3.5).toFixed(2) + 's';
        el.style.opacity = (0.25 + Math.random() * 0.55).toFixed(2);
        const size = 3 + Math.random() * 6;
        el.style.width = size.toFixed(0) + 'px';
        el.style.height = size.toFixed(0) + 'px';
        container.appendChild(el);
      }
    })();

    // Custom oscilloscope-ish cursor
    const cursor = document.querySelector(".cursor-inner");
    const cursor2 = document.querySelector(".cursor-outer");
    const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reducedMotion) {
      document.addEventListener("mousemove", (e) => {
        cursor.style.top = e.pageY + "px";
        cursor.style.left = e.pageX + "px";
        cursor2.style.top = e.pageY + "px";
        cursor2.style.left = e.pageX + "px";
      });
    }
  </script>
</body>
